name: Sync listings to static site

# Manual "publish" button: regenerates the pre-rendered event/business listing
# pages from the live API and pushes them. The push triggers the Static Web
# Apps CI/CD workflow, which deploys the site (~1-2 minutes).
#
# Flow: chat/website writes -> Azure Table Storage -> (tap Run workflow) ->
# this job bakes cards into site/ -> commit+push if changed -> SWA deploys.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-listings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/staticgen/requirements.txt

      - name: Regenerate listing pages from live API
        run: |
          python tools/staticgen/build.py \
            --site-src site \
            --out /tmp/sitegen \
            --source api \
            --api-base https://gentle-desert-0872cca0f.7.azurestaticapps.net \
            --force
          cp /tmp/sitegen/events/index.html site/events/index.html
          cp /tmp/sitegen/businesses/index.html site/businesses/index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/events/index.html site/businesses/index.html
          if git diff --cached --quiet; then
            echo "No listing changes."
          else
            git commit -m "Sync listings [automated]"
            git push
          fi
